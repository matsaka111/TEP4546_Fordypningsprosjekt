[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fordypning"
version = "0.1.0"
description = "Neural network surrogate modeling for chemical kinetics ODEs (TEP4541)"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "torch",
    "numpy",
    "matplotlib",
    "pandas",
    "scipy",
    "pyarrow",
    # cantera is conda-forge only -- installed via environment.yml, not pip
]

[project.optional-dependencies]
dev = [
    "jupyterlab",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["fordypning*"]